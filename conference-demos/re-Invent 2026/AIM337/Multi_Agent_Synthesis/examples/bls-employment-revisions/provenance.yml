preparation:
  - Retrieved the official CSV responses through a web-fetch tool and saved text snapshots.
  - Preserved the three numeric observations in each vintage without resampling or imputation.
  - Made each header's vintage date explicit and represented observation months as YYYY-MM.
  - Added series metadata and definitions from ALFRED.
  - Only the JSON data files are model inputs; this provenance record is documentation.

limitations:
  - These are historical estimates as known on the stated vintage dates, not current estimates.
  - Employment levels are in thousands of persons, not monthly changes.
  - The vintages describe revisions to one series and are not independent corroborating sources.
  - The captures are UTF-8 text snapshots, not byte-for-byte HTTP archives.
  - ALFRED supplies archived BLS data; these extracts were not downloaded directly from BLS.
